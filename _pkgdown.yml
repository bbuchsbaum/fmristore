url: https://bbuchsbaum.github.io/fmristore/
template:
  bootstrap: 5
  light-switch: yes
  theme: arrow-light
  bslib:
    primary: '#2E86AB'
    secondary: '#A23B72'
    success: '#A8DADC'
    info: '#457B9D'
    warning: '#F1C40F'
    danger: '#E74C3C'
    light: '#F8F9FA'
    dark: '#1D3557'
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Sans Pro
    code_font:
      google: Source Code Pro
  package: albersdown
home:
  title: 'fmristore: Efficient Storage of fMRI Data'
  description: >
    Stores fmridataset frames in HDF5 with atomic writes, lazy reads,
    append-only sharded stores, recovery, and HDF5 array sources.
  sidebar:
    structure:
    - links
    - license
    - community
    - citation
    - authors
    - dev
    components:
      citation:
        title: Citation
        text: "If you use fmristore in your research, please cite:\n\n```\nBuchsbaum,
          B. (2024). fmristore: Efficient Storage of fMRI Data. \nR package version
          0.1.0. https://github.com/bbuchsbaum/fmristore\n```\n"
navbar:
  structure:
    left:
    - intro
    - reference
    - news
    right:
    - search
    - github
  components:
    intro:
      text: Get Started
      href: articles/fmristore.html
    reference:
      text: Reference
      href: reference/index.html
articles:
- title: Getting Started
  navbar: ~
  contents:
  - fmristore
news:
  releases:
  - text: Version 0.1.0
    href: https://github.com/bbuchsbaum/fmristore/releases/tag/v0.1.0
footer:
  structure:
    left:
    - built_with
    - package
    right: github
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/bbuchsbaum/fmristore
      aria-label: GitHub
    package:
      html: |
        <p>Developed by <a href="https://orcid.org/0000-0002-5891-3515">Bradley Buchsbaum</a>.</p>
        <p>Licensed under <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3</a>.</p>
authors:
  Bradley Buchsbaum:
    href: https://orcid.org/0000-0002-5891-3515
